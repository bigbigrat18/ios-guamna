name: shim

# Builds the guamna boot shim (shim/) into a `fastboot boot`-able image.
#
# Input: a guamna boot.img; only its DTB and header geometry are used.
#   boot_source = lineage (default): the newest official LineageOS guamna
#                 boot.img, from download.lineageos.org, SHA-256 checked
#   boot_source = draft: your own image, attached to a DRAFT release named
#                 "guamna-boot" (never commit boot images to git)
# See docs/PORTING_GUAMNA.md, "Shim in CI".
#
# payload = none   -> probe screen: CPU features, PSCI, GIC (milestone 1)
# payload = kernel -> latest xnu-kernel-guamna artifact + mkadt --board guamna
#                     + mkpayload, so the shim boots XNU

on:
  workflow_dispatch:
    inputs:
      payload:
        description: none = probe screen; kernel = boot the latest GUAMNA XNU build
        type: choice
        options: [none, kernel]
        default: none
      cmdline:
        description: XNU boot-args (payload=kernel)
        default: "debug=0xc serial=3 cpus=1 keepsyms=1 -enable_kprintf_spam -noprogress"
      boot_source:
        description: lineage = official LineageOS guamna boot.img; draft = .img in the draft release below
        type: choice
        options: [lineage, draft]
        default: lineage
      release:
        description: Name of the draft release holding boot.img (boot_source=draft)
        default: guamna-boot
  # Called by xnu.yml right after its GUAMNA build (same_run: kernel artifact of that run)
  workflow_call:
    inputs:
      payload:
        type: string
        default: kernel
      cmdline:
        type: string
        default: "debug=0xc serial=3 cpus=1 keepsyms=1 -enable_kprintf_spam -noprogress"
      boot_source:
        type: string
        default: lineage
      release:
        type: string
        default: guamna-boot
      same_run:
        type: boolean
        default: false

permissions:
  contents: write   # needed to see draft releases
  actions: read     # needed to download the kernel artifact

jobs:
  shim:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu cpio
          # Ubuntu's mkbootimg package lacks its gki module; use AOSP's, pinned.
          git clone -q --depth 1 --branch android-15.0.0_r1 \
            https://android.googlesource.com/platform/system/tools/mkbootimg "$RUNNER_TEMP/mkbootimg"
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec python3 "%s/mkbootimg.py" "$@"\n' "$RUNNER_TEMP/mkbootimg" > "$RUNNER_TEMP/bin/mkbootimg"
          chmod +x "$RUNNER_TEMP/bin/mkbootimg"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/mkbootimg" --help > /dev/null
          command -v aarch64-linux-gnu-gcc

      - name: Fetch boot.img from LineageOS
        if: inputs.boot_source == 'lineage'
        run: |
          mkdir -p private
          curl -fsS https://download.lineageos.org/api/v2/devices/guamna/builds > private/builds.json
          read -r url sha date < <(python3 - <<'EOF'
          import json
          b = json.load(open('private/builds.json'))[0]
          f = next(f for f in b['files'] if f['filename'] == 'boot.img')
          print(f['url'], f['sha256'], b['date'])
          EOF
          )
          echo "LineageOS guamna build $date: $url"
          curl -fL --retry 3 -o private/boot.img "$url"
          echo "$sha  private/boot.img" | sha256sum -c -

      - name: Fetch boot.img from the draft release
        if: inputs.boot_source == 'draft'
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.draft and .name == "${{ inputs.release }}") | .assets[] | select(.name | endswith(".img")) | .id' | head -1)
          if [ -z "$id" ]; then
            echo "::error::No .img asset in a draft release named '${{ inputs.release }}'. Releases > Draft a new release > title '${{ inputs.release }}' > attach boot.img > Save draft."
            exit 1
          fi
          mkdir -p private
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > private/boot.img
          ls -l private/boot.img
          head -c 8 private/boot.img | grep -q 'ANDROID!' || { echo "::error::not an Android boot image"; exit 1; }

      - name: Unpack DTB and header geometry
        run: |
          python3 tools/unpack_bootv2.py private/boot.img private/unpacked > /dev/null
          grep -v '^cmdline' private/unpacked/header.txt
          grep -q '^header_version: 2$' private/unpacked/header.txt || {
            echo "::error::need a boot image header v2 with the DTB inside (guamna launched on Android 10)"; exit 1; }
          [ -s private/unpacked/dtb ] || { echo "::error::boot.img has no DTB section"; exit 1; }
          python3 - <<'EOF' >> "$GITHUB_ENV"
          h = dict(l.split(': ', 1) for l in open('private/unpacked/header.txt').read().splitlines() if ': ' in l)
          osv = int(h['os_version'], 16)
          ver, lvl = osv >> 11, osv & 0x7ff
          print(f"KERNEL_OFFSET={h['kernel_addr']}")
          print(f"RAMDISK_OFFSET={h['ramdisk_addr']}")
          print(f"TAGS_OFFSET={h['tags_addr']}")
          print(f"DTB_OFFSET={h['dtb_addr']}")
          print(f"PAGESIZE={h['page_size']}")
          if osv:
              print(f"OS_VERSION={ver >> 14}.{(ver >> 7) & 0x7f}.{ver & 0x7f}")
              print(f"OS_PATCH_LEVEL={(lvl >> 4) + 2000}-{lvl & 0xf:02d}")
          EOF
          echo "DTB=$PWD/private/unpacked/dtb" >> "$GITHUB_ENV"
          # Motorola's ABL software-reboots ~2 s after "Booting OKAY" when the
          # header cmdline is just "console=null" (bisected with h1-h3 hybrids,
          # 2026-11-01). Use the stock image's own header cmdline.
          echo "BOOT_CMDLINE=$(sed -n 's/^cmdline: //p' private/unpacked/header.txt)" >> "$GITHUB_ENV"

      - name: Kernel from this run (called by xnu.yml)
        if: inputs.payload == 'kernel' && inputs.same_run
        uses: actions/download-artifact@v4
        with:
          name: xnu-kernel-guamna
          path: xnu/out

      - name: XNU payload (payload=kernel)
        if: inputs.payload == 'kernel'
        run: |
          mkdir -p xnu/out shim/out
          [ -f xnu/out/kernel.development.guamna ] && echo "kernel from this run ($GITHUB_RUN_ID)"
          [ -f xnu/out/kernel.development.guamna ] || for run in $(gh run list -R "$GITHUB_REPOSITORY" -w xnu.yml --status success -L 20 --json databaseId -q '.[].databaseId'); do
            if gh run download "$run" -R "$GITHUB_REPOSITORY" -n xnu-kernel-guamna -D xnu/out 2>/dev/null; then
              echo "kernel from xnu run $run"; break
            fi
          done
          ls -l xnu/out/kernel.*.guamna
          python3 tools/mkadt.py shim/out/guamna.adt --board guamna
          python3 tools/mkpayload.py xnu/out/kernel.development.guamna shim/out/guamna.adt shim/out/payload.bin \
            --cmdline "${{ inputs.cmdline }}"
          echo "PAYLOAD=../shim/out/payload.bin" >> "$GITHUB_ENV"

      - name: Build shim boot image
        run: |
          echo "geometry: kernel=$KERNEL_OFFSET ramdisk=$RAMDISK_OFFSET tags=$TAGS_OFFSET dtb=$DTB_OFFSET page=$PAGESIZE os=${OS_VERSION:-default} ${OS_PATCH_LEVEL:-}"
          mkdir -p upload
          if [ "${{ inputs.payload }}" = none ]; then
            # Bisection images: s<n> parks the CPU forever after step n (shim.c STOP_AT)
            for n in 0 1 2 3 4; do
              SHIM_EXTRA_CFLAGS="-DSHIM_STOP=$n" BOARD=guamna shim/build.sh > /dev/null
              cp shim/out/shim-boot.img "upload/shim-boot-guamna-s$n.img"
              [ $n = 0 ] && cp shim/out/Image private/shim-s0-Image && cp shim/out/ramdisk.bin private/empty-ramdisk.bin
            done
            # Hybrids with the LineageOS image, to find what ABL refuses in ours:
            #   h1 = LOS kernel + LOS ramdisk + LOS cmdline (our repacking only)
            #   h2 = shim s0   + LOS ramdisk + LOS cmdline
            #   h3 = shim s0   + empty ramdisk + LOS cmdline   (s0 = + "console=null")
            los_cmdline="$BOOT_CMDLINE"
            echo "LineageOS header cmdline: $los_cmdline"
            hyb() {
              mkbootimg --header_version 2 --kernel "$1" --ramdisk "$2" --dtb "$DTB" --base 0 \
                --kernel_offset "$KERNEL_OFFSET" --ramdisk_offset "$RAMDISK_OFFSET" --tags_offset "$TAGS_OFFSET" \
                --dtb_offset "$DTB_OFFSET" --pagesize "$PAGESIZE" --os_version "$OS_VERSION" \
                --os_patch_level "$OS_PATCH_LEVEL" --cmdline "$los_cmdline" -o "$3"
            }
            hyb private/unpacked/kernel private/unpacked/ramdisk upload/shim-boot-guamna-h1.img
            hyb private/shim-s0-Image  private/unpacked/ramdisk upload/shim-boot-guamna-h2.img
            hyb private/shim-s0-Image  private/empty-ramdisk.bin upload/shim-boot-guamna-h3.img
          fi
          BOARD=guamna shim/build.sh ${PAYLOAD:-}
          cp shim/out/shim-boot.img "upload/shim-boot-guamna-${{ inputs.payload }}.img"
          [ -f shim/out/guamna.adt ] && cp shim/out/guamna.adt upload/ || true
          sha256sum upload/*

      - uses: actions/upload-artifact@v4
        with:
          name: shim-boot-guamna-${{ inputs.payload }}
          path: upload/
          retention-days: 14
