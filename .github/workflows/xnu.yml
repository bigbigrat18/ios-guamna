name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG (SWEET = Redmi Note 10 Pro, GUAMNA = Moto G Play 2021, ALL = both)
        type: choice
        options: [SWEET, GUAMNA, ALL]
        default: SWEET
      runner:
        description: macOS runner. macos-15 = Xcode 16 (needs patch 0084); macos-15-intel = same on Intel (separate, often shorter queue); macos-14 = Xcode 15, retired 2026-11-02
        type: choice
        options: [macos-14, macos-15, macos-15-intel]
        default: macos-15-intel
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
      boot_image:
        description: GUAMNA only - also build the shim boot image (shim.yml, payload=kernel) from this kernel
        type: boolean
        default: true
      boot_cmdline:
        description: XNU boot-args for that boot image
        default: "debug=0xc serial=3 cpus=1 keepsyms=1 -enable_kprintf_spam -noprogress rd=emmcroot0"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}

jobs:
  build:
    name: build (${{ matrix.machine }})
    strategy:
      fail-fast: false
      matrix:
        # push: GUAMNA only (one macOS runner to queue for, not two);
        # workflow_dispatch: the chosen one, or ALL
        machine: ${{ fromJSON(github.event_name != 'workflow_dispatch' && '["GUAMNA"]' || (inputs.machine_config == 'ALL' && '["SWEET","GUAMNA"]' || format('["{0}"]', inputs.machine_config))) }}
    env:
      MACHINE_CONFIG: ${{ matrix.machine }}
    # macos-14 shipped Xcode 15 (iig matched xnu-8796); it retired 2026-11-02.
    # Xcode 16 iig emits IORPC.kernelContent: patch 0084 backports the field.
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET/GUAMNA kernels are plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          if [ "$MACHINE_CONFIG" = GUAMNA ]; then
            # xcodebuild compiles libfirehose_kernel for arm64-apple-macos, i.e.
            # Apple clang's apple-m1 default CPU: LSE atomics and LDAPR, which
            # are UNDEFINED on guamna's A53/A73. Pin its arm64 slice like the kernel (see the script).
            python3 .github/scripts/guamna-firehose-cpu.py dxb/build.sh
          fi
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: bash build.sh

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.machine == 'SWEET' && 'xnu-buildtree' || 'xnu-buildtree-guamna' }}
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      # guamna's Cortex-A53/A73 are ARMv8.0: any LSE atomic (ARMv8.1), RCpc
      # load (ARMv8.3), STLUR (ARMv8.4) or PAN access in the kernel is an
      # UNDEFINED instruction on the phone. Fail here instead of on the device.
      - name: ARMv8.0 instruction guard (GUAMNA)
        if: matrix.machine == 'GUAMNA'
        run: |
          # Disassemble EVERY code section (the kernel's code is in __TEXT_EXEC,
          # which `otool -t` does not read) with a decoder that knows v8.1+.
          shopt -s nullglob
          kernels=(out/kernel.*.guamna)
          [ ${#kernels[@]} -gt 0 ] || { echo "no guamna kernel built"; exit 1; }
          bad='[[:space:]](cas(p)?(a|al|l)?[bh]?|ld(add|clr|eor|set|smax|smin|umax|umin)(a|al|l)?[bh]?|st(add|clr|eor|set|smax|smin|umax|umin)l?[bh]?|swp(a|al|l)?[bh]?|ldapr[bh]?|ldapur[a-z]*|stlur[bh]?)[[:space:]]|msr[[:space:]]+[Pp][Aa][Nn]'
          # Constant tables that live in code sections and decode as junk.
          data_syms='^<(K256|_K256|K512|_K512)>:$'
          status=0
          for k in "${kernels[@]}"; do
            xcrun llvm-objdump -d --no-show-raw-insn \
              --mattr=+v8.5a,+lse,+rcpc,+rcpc-immo,+pan,+rdm,+fullfp16,+dotprod "$k" > "$k.dis"
            total=$(grep -c '^ *[0-9a-f]*:' "$k.dis" || true)
            hits=$(awk -v re="$bad" -v data="$data_syms" '
              /^[0-9a-f]+ <.*>:$/ {fn=$2; skip=(fn ~ data)}
              !skip && $0 ~ re {print fn, $0}' "$k.dis")
            n=$(printf '%s' "$hits" | grep -c . || true)
            echo "$k: $total instructions, $n not ARMv8.0, $(grep -c ldaxr "$k.dis" || true) ldaxr"
            if [ "$total" -lt 100000 ]; then echo "disassembly too small: guard is not looking at the kernel"; status=1; fi
            if [ "$n" != 0 ]; then printf '%s\n' "$hits" | head -60; status=1; fi
            rm -f "$k.dis"
          done
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.machine == 'SWEET' && 'xnu-kernel' || 'xnu-kernel-guamna' }}
          path: out/
          if-no-files-found: warn

  # Boot image from this run's kernel, in the same run: no second dispatch,
  # and only a quick Ubuntu job after the macOS build.
  boot:
    needs: build
    if: >-
      success() && (github.event_name != 'workflow_dispatch' ||
      (inputs.boot_image && (inputs.machine_config == 'GUAMNA' || inputs.machine_config == 'ALL')))
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/shim.yml
    with:
      payload: kernel
      cmdline: ${{ inputs.boot_cmdline || 'debug=0xc serial=3 cpus=1 keepsyms=1 -enable_kprintf_spam -noprogress rd=emmcroot0' }}
      same_run: true
